<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>超级个人日报中心</title><style>
:root{--ink:#1a1a1a;--muted:#666;--line:#e8e8e8;--accent:#0969da;--bg:#fafbfc;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.75}
.wrap{max-width:100%;margin:0 auto;padding:48px 44px 80px}
header.hero{border-bottom:3px solid var(--ink);padding-bottom:20px;margin-bottom:36px}
header.hero h1{margin:0 0 8px;font-size:30px}
header.hero .meta{color:var(--muted);font-size:14px}
.portal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px;display:flex;flex-direction:column}
.pcard h2{margin:0 0 10px;font-size:21px}
.pcard p{margin:0 0 14px;font-size:14.5px;color:var(--muted);flex:1}
.pcard .meta{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.pcard .meta b{color:var(--ink)}
.pcard a.btn{display:inline-block;text-align:center;font-size:15px;color:#fff;background:var(--accent);border-radius:10px;padding:10px 20px;text-decoration:none}
.pcard a.btn:hover{opacity:.9}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:700px){.wrap{padding:24px 16px 60px}}
</style></head><body><div class="wrap">
<header class="hero"><h1>超级个人日报中心</h1>
<div class="meta">每天自动生成 · 选择一份报告进入</div></header>
<div class="portal-grid"><div class="pcard"><h2>GitHub 分析报告</h2><p>Star/Fork 仓库动态 + Trending 深度分析，每日更新</p>
<div class="meta">最新一期：<b>2026-10-20</b></div>
<a class="btn" href="github/">查看报告 →</a></div><div class="pcard"><h2>网站需求接单分析报告</h2><p>网站类外包需求扫描、价格区间与接单切入点，每日更新</p>
<div class="meta">最新一期：<b>2026-10-20</b></div>
<a class="btn" href="orders/">查看报告 →</a></div><div class="pcard"><h2>超级个人机会执行</h2><p>机会池状态 + 每日行动清单，执行导向</p>
<div class="meta">最新一期：<b>2026-10-20</b></div>
<a class="btn" href="opportunities/">查看报告 →</a></div></div>
<footer>报告由定时任务每日自动生成 · 数据来源见各报告内说明</footer>
</div></body></html>
